name: kelompok_strava_uas_moprog
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  http: ^1.2.2
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.6
  lorem_ipsum: ^0.0.3
  image_picker: ^1.1.2
  share_plus: 13.3.1
  fl_chart: ^1.3.1
  video_player: ^2.14.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_riverpod: 2.6.1
  firebase_core: ^5.2.0
  cloud_firestore: ^7.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3
  flutter_material_design_icons: ^3.1.0+7447
  phosphoricons_flutter: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - asset/images/
    - asset/videos/
    - asset/spots.json
    - asset/overpass_snapshot.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asset/images/stride_logo.jpg"
  adaptive_icon_background: "#0B051F"
  adaptive_icon_foreground: "asset/images/stride_logo.jpg"